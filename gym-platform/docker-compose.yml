services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_dev_password
      POSTGRES_DB: gym_platform
    ports:
      - "5434:5432"  # <-- Changed to 5434
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
